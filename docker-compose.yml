version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount these specific files/folders to ensure data persists 
      # and the container uses the existing database/config
      - ./backend/processor.db:/app/processor.db
      - ./backend/config_seed.json:/app/config_seed.json
      - ./backend/files:/app/files
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80" # Map Vite's default dev port to Nginx for familiarity
    depends_on:
      - backend
    restart: unless-stopped
